components:
  schemas:
    FullTemplateVersionNumber:
      type: string
      pattern: ^(0|([1-9]{1}\d*)).(0|([1-9]{1}\d*))$
      minLength: 1
      maxLength: 10
    ResourceName:
      type: string
      pattern: ^[0-9A-Za-z]+[0-9A-Za-z_\-]*$
      minLength: 1
      maxLength: 100
    ValidationException: {}
    ServiceTemplateArn:
