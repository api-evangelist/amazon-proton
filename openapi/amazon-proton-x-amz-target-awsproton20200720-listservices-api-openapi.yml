      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    ResourceName:
      type: string
      pattern: ^[0-9A-Za-z]+[0-9A-Za-z_\-]*$
      minLength: 1
      maxLength: 100
    ValidationException: {}
    NextToken:
      type: string
      pattern: ^[A-Za-z0-9+=/]+$
    ListServicesOutput:
      type: object
      required:
      - services
      properties:
        nextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: A token that indicates the location of the next service in the array of services, after the current requested list of services.
        services:
          allOf:
          - $ref: '#/components/schemas/ServiceSummaryList'
          - description: An array of services with summaries of detail data.
    ThrottlingException: {}
    StatusMessage:
      type: string
      format: password
    Description:
      type: string
      minLength: 0
      maxLength: 500
      format: password
    ServiceStatus:
      type: string
      enum:
      - CREATE_IN_PROGRESS
      - CREATE_FAILED_CLEANUP_IN_PROGRESS
      - CREATE_FAILED_CLEANUP_COMPLETE
      - CREATE_FAILED_CLEANUP_FAILED
      - CREATE_FAILED
      - ACTIVE
      - DELETE_IN_PROGRESS
      - DELETE_FAILED
      - UPDATE_IN_PROGRESS
      - UPDATE_FAILED_CLEANUP_IN_PROGRESS
      - UPDATE_FAILED_CLEANUP_COMPLETE
      - UPDATE_FAILED_CLEANUP_FAILED
      - UPDATE_FAILED
      - UPDATE_COMPLETE_CLEANUP_FAILED
    Timestamp:
      type: string
      format: date-time
    ListServicesInput:
      type: object
      title: ListServicesInput
      properties:
        maxResults:
          allOf:
          - $ref: '#/components/schemas/MaxPageResults'
          - description: The maximum number of services to list.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: A token that indicates the location of the next service in the array of services, after the list of services that was previously requested.
    MaxPageResults:
      type: integer
      minimum: 1
      maximum: 100
    ServiceSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/ServiceSummary'
    ServiceSummary:
      type: object
      required:
      - arn
      - createdAt
      - lastModifiedAt
      - name
      - status
      - templateName
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/ServiceArn'
          - description: The Amazon Resource Name (ARN) of the service.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time when the service was created.
        description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: A description of the service.
        lastModifiedAt:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time when the service was last modified.
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: The name of the service.
        status:
          allOf:
          - $ref: '#/components/schemas/ServiceStatus'
          - description: The status of the service.
        statusMessage:
          allOf:
          - $ref: '#/components/schemas/StatusMessage'
          - description: A service status message.
        templateName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: The name of the service template.
      description: Summary data of an Proton service resource.
    ServiceArn:
      type: string
    AccessDeniedException: {}
    InternalServerException: {}
