      - GITHUB_ENTERPRISE
      - BITBUCKET
    ResourceSyncStatus:
      type: string
      enum:
      - INITIATED
      - IN_PROGRESS
      - SUCCEEDED
      - FAILED
    ThrottlingException: {}
    GetServiceInstanceSyncStatusInput:
