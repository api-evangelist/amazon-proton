    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: RejectEnvironmentAccountConnection
      description: 'In a management account, reject an environment account connection from another environment account.


        After you reject an environment account connection request, you can''t accept or use the rejected environment account connection.


        You can’t reject an environment account connection that''s connected to an environment.


        For more information, see Environment account connections in the Proton User guide.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectEnvironmentAccountConnectionOutput'
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ThrottlingException
