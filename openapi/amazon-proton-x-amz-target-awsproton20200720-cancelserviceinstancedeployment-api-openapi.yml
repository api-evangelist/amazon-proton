    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CancelServiceInstanceDeployment
      description: 'Attempts to cancel a service instance deployment on an UpdateServiceInstance action, if the deployment is IN_PROGRESS. For more information, see Update a service instance in the Proton User guide.


        The following list includes potential cancellation scenarios.


        If the cancellation attempt succeeds, the resulting deployment state is CANCELLED.


        If the cancellation attempt fails, the resulting deployment state is FAILED.


        If the current UpdateServiceInstance action succeeds before the cancellation attempt starts, the resulting deployment state is SUCCEEDED and the cancellation attempt has no effect.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelServiceInstanceDeploymentOutput'
        '480':
          description: ValidationException
          content:
