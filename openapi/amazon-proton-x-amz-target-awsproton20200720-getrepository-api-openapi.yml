components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    RepositoryArn:
      type: string
    ValidationException: {}
    RepositoryName:
      type: string
      pattern: '[A-Za-z0-9_.-].*/[A-Za-z0-9_.-].*'
      minLength: 1
      maxLength: 100
    Repository:
      type: object
      required:
      - arn
      - connectionArn
      - name
      - provider
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/RepositoryArn'
          - description: The Amazon Resource Name (ARN) of the linked repository.
        connectionArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The Amazon Resource Name (ARN) of your AWS CodeStar connection that connects Proton to your repository provider account.
        encryptionKey:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: Your customer Amazon Web Services KMS encryption key.
        name:
          allOf:
          - $ref: '#/components/schemas/RepositoryName'
          - description: The repository name.
        provider:
          allOf:
          - $ref: '#/components/schemas/RepositoryProvider'
          - description: The repository provider.
      description: Detailed data of a linked repository—a repository that has been registered with Proton.
    ResourceNotFoundException: {}
    RepositoryProvider:
      type: string
      enum:
      - GITHUB
      - GITHUB_ENTERPRISE
      - BITBUCKET
    Arn:
      type: string
      pattern: ^arn:(aws|aws-cn|aws-us-gov):[a-zA-Z0-9-]+:[a-zA-Z0-9-]*:\d{12}:([\w+=,.@-]+[/:])*[\w+=,.@-]+$
      minLength: 1
      maxLength: 200
    GetRepositoryOutput:
      type: object
      required:
      - repository
      properties:
        repository:
          allOf:
          - $ref: '#/components/schemas/Repository'
          - description: The repository link's detail data that's returned by Proton.
    ThrottlingException: {}
    AccessDeniedException: {}
    GetRepositoryInput:
      type: object
      required:
      - name
      - provider
      title: GetRepositoryInput
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/RepositoryName'
          - description: The repository name, for example <code>myrepos/myrepo</code>.
        provider:
          allOf:
          - $ref: '#/components/schemas/RepositoryProvider'
          - description: The repository provider.
    InternalServerException: {}
